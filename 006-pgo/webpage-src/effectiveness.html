  <title>Pokémon GO attack type effectiveness</title>
</head>
BODYSTART
<p class="intro">A Pokémon has either monadic or dyadic typing.
  For the dyadic case, order has no functional impact.
  The range of type effectiveness is [ -2, 1 ] against monadic types and [ -3, 2 ] against dyadic types.
  Columns attack, rows defend.</p>
