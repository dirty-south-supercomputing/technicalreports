  <div class="intro">The following Pokémon GO forms are categorized as
    Mythical, Legendary, Ultra Beasts, or Legendary Fusions. With the
    exceptions of Meltan and Melmetal, Mythicals cannot be traded.
    Fused and Crowned forms cannot be traded while in those forms.</div>
